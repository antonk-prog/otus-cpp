name: mapreduce

on:
  push:
    branches:
      - master
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y g++ python3

      - name: Build
        run: make all

      - name: Test
        run: make test
