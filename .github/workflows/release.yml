name: fashion_mnist

on:
  push:
    branches:
      - master
      - '**'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Generate DEB package
        run: |
          cd build
          cpack -G DEB

      - name: Upload DEB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fashion_mnist-deb
          path: build/fashion_mnist-*.deb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
          files: build/fashion_mnist-*.deb
